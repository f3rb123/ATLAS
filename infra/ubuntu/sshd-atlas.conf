# Reviewed operator-installed drop-in; never installed automatically by ATLAS.
# Verify a working named sudo user with a public key before applying.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
X11Forwarding no
AllowTcpForwarding local
ClientAliveInterval 300
ClientAliveCountMax 2
