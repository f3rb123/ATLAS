name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: uv sync --frozen
      - run: uv run atlas host embeddings-prepare
      - run: uv run pytest -q --junitxml=docs/test-results/pytest.xml
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: scripts/ci-e2e.sh
        env:
          ATLAS_PLAYWRIGHT_BUNDLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: docs/test-results/
