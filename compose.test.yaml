# TEST ONLY: local synthetic provider and explicit private-endpoint allowlist.
# Never include this override in production deployment commands.
services:
  api:
    environment:
      ATLAS_PROVIDER_LOCAL_ALLOWLIST: '["fixture-provider:9001"]'
      NO_PROXY: ${NO_PROXY:-},api,web,postgres,redis,gateway,relay,fixture-provider,localhost,127.0.0.1
      no_proxy: ${NO_PROXY:-},api,web,postgres,redis,gateway,relay,fixture-provider,localhost,127.0.0.1
  gateway:
    environment:
      ATLAS_PROVIDER_LOCAL_ALLOWLIST: '["fixture-provider:9001"]'
      NO_PROXY: ${NO_PROXY:-},api,web,postgres,redis,gateway,relay,fixture-provider,localhost,127.0.0.1
      no_proxy: ${NO_PROXY:-},api,web,postgres,redis,gateway,relay,fixture-provider,localhost,127.0.0.1
  fixture-provider:
    image: python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    command: [python, /fixtures/provider.py]
    volumes: ['./tests/e2e_provider.py:/fixtures/provider.py:ro']
    environment:
      ATLAS_TEST_PROVIDER_BIND: 0.0.0.0
      ATLAS_TEST_PROVIDER_DELAY: '0.25'
    networks: [backend]
    read_only: true
    user: '65534:65534'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: 'no'
